name: CI

on:
  workflow_call:
  push:
    branches: "**"
    tags-ignore: "**"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Dependencies
        run: npm ci
      - name: Build WASM
        run: npm run build-wasm
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm run coverage -- run
